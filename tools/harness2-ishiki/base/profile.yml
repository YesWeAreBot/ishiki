model: openai:ishiki
mode: channel

channels:
  "test:bot":
    - "group:*"
    - "private:*"

context:
  engine: standard
  standard:
    maxTokens: 16000
    refillRatio: 0.8

wakeup:
  engine: standard
  standard:
    direct: true
    atSelf: true
    quoteSelf: true
    keywords: []

toolcall:
  engine: native

codemode:
  enable: true
  direct: []
  timeoutMs: 30000

typing:
  baseDelay: 0
  charPerSecond: 0
  minDelay: 0
  maxDelay: 0

attachment:
  imageInput: false
