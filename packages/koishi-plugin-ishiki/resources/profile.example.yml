# Profile 示例：一份人设 = 一个通信域。
# 放在 <dataPath>/profiles/<目录名>/profile.yml（或 .yaml）；目录名即 id 的缺省值。
id: neko # 可选，缺省为所在目录名
description: 示例人设 # 仅用于显示

presets:
  # Preset 是可复用的运行模式；Scene 引用它，铺平后就是那个 Scene 的运行参数。
  chat:
    description: 日常聊天
    model: openai:gpt-5.6-luna # provider:model，或 gateway 里定义的组名
    failover:
      attempts: 3 # 缺省跑完一轮候选
      backoffMs: 500 # 逐次翻倍，封顶 8s，取半抖动
      failoverOn: unavailable # 或 any
    context:
      # 上下文引擎：standard 线性增长，到上限后把最旧的一段压成摘要
      engine: standard
      standard:
        maxChars: 32000 # 单轮模型输入的字符上限
        refillRatio: 0.8 # 压缩后压到上限的多少，留出余量
    wakeup:
      # 唤醒引擎：standard 按下面几条判定一条消息要不要理
      engine: standard
      standard:
        direct: true # 私聊必醒
        atSelf: true # 被 @ 必醒
        quoteSelf: true # 被引用回复必醒
        keywords: [neko, 喵酱] # 提到这些词也醒
    toolcall:
      # 工具调用引擎：native 用模型原生 function call（缺省）；
      # 其余按输出协议名取，由解析引擎从纯文本输出里提取调用，不需要模型原生支持 function call：
      # classic（v3 的 JSON OUTPUT，每步必带 thoughts 三段）/ hermes / qwen3coder / morph-xml / yaml-xml
      engine: native
    # 发消息前等多久，模拟打字
    typing:
      baseDelay: 500
      charPerSecond: 5
      minDelay: 800
      maxDelay: 4000

  # 从 YesImBot v3 迁过来的一套：WorldState 上下文、JSON OUTPUT 工具协议、响应意愿唤醒。
  # 三者各自独立，也可以和别的引擎混搭。
  v3:
    description: v3 迁移三件套
    model: openai:gpt-5.6-luna
    context:
      engine: classic
      classic:
        maxMessages: 50 # 单轮窗口内的消息条数上限
        keepFullTurnCount: 2 # 保留最近几轮的完整思考/行动/观察，更早的只留消息
        memoryBlocks: true # 把 <profileDir>/memory/*.md 当核心记忆块注入 system
    wakeup:
      engine: classic
      classic:
        base: 12 # 一条普通消息的基础分
        atMention: 100 # 被 @ 的加成
        isQuote: 15 # 引用本账号的加成
        isDirectMessage: 40 # 私聊的加成
        keywords: [neko, 喵酱] # 命中任一即改用 keywordMultiplier
        keywordMultiplier: 1.2
        defaultMultiplier: 1
        maxWillingness: 100 # 意愿上限
        decayHalfLifeSeconds: 600 # 不被打扰时的衰减半衰期
        probabilityThreshold: 55 # 概率从这个阈值之上起跳
        probabilityAmplifier: 0.04
        replyCost: 35 # 一轮结束后扣掉的意愿
    toolcall:
      engine: classic

  # 唤醒交给 Jev（TypeSafe）判定：规则只兜私聊与 @，其余消息都问一次模型。
  # 需要 apiKey，或环境变量 TYPESAFE_API_KEY；缺了这份 profile 会在装载时被跳过。
  jev:
    description: 规则兜底 + Jev 判定的唤醒
    model: openai:gpt-5.6-luna
    context:
      engine: standard # 上下文与唤醒各自独立，这里只把唤醒换掉
    wakeup:
      engine: jev
      jev:
        # 补充判据：身份、语气、什么时候该闭嘴都写在这里。内置判据已按场景分档（私聊默认该回、
        # 群聊默认别插话），这段是在它之上加约束——写得好是加分，写漏了也不塌下限。
        instruction: |
          neko，猫娘，话不多但会接梗。
          只在有人点名、话题与自己在做的工作有关、或有人明显在征求意见时插话；
          几个人互相寒暄时保持安静。
        threshold: 0.5 # 概率阈值，调高更沉默
        cooldownMs: 30000 # 上次开口后的静默期（毫秒）；硬命中的规则不受它约束
        historyMessages: 8 # 喂给模型的最近消息条数
        timeoutMs: 1500 # 单次判定等待上限（毫秒），超时按不唤醒处理
        # 兜底规则：命中即唤醒、不问模型。默认只开私聊与 @，其余交给模型
        rules:
          direct: true
          atSelf: true
          quoteSelf: false
          keywords: []

scenes:
  # 一个 Scene 绑定一个账号，认领该账号名下一组频道（工厂）；
  # 每个匹配到的频道各起一个独立的意识实例，历史互不相通。
  groups:
    description: 群聊
    preset: chat
    sid: onebot:10000 # 必填：该 Scene 绑定的账号
    whitelist:
      - "group:*" # `*` 全部，尾随 `*` 按前缀，其余精确匹配
      - "123456789"
    blacklist:
      - "987654321" # 排除的频道，写法同 whitelist
    # 也可在 Scene 上局部覆写 preset
    typing:
      charPerSecond: 8
  dms:
    description: 私聊
    preset: chat
    sid: onebot:10000
    whitelist:
      - "private:*"
