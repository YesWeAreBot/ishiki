# Profile 示例：
# 放在 <dataPath>/profiles/<目录名>/profile.yml（或 .yaml）。
#
# 下面的三段是三份**互相独立**的文件（三个目录），用注释分开，方便对照着看：
#   profiles/neko/profile.yaml   按频道隔离：每个认领的频道各派生一个意识实例
#   profiles/fused/profile.yaml  cross：多账号多频道合成一块视窗
#   profiles/jev/profile.yaml    唤醒交给 Jev（TypeSafe）判定
#
# 一个 profile 就是生效单位：channels 声明它认领哪些账号下的哪些频道，
# 装配时静态过滤，认领关系不会随事件变化。mode 决定派生方式：
#   channel（缺省）  每个频道一个 runtime，历史互不相通
#   cross           整个 profile 只有一个 runtime，认领的频道共享同一块事实流
# profile 目录下的 persona.md、memory/、mcp.json 等由所有 runtime 共享，
# 每个 runtime 的事实流与工作区放在 runtimes/<账号/频道>/ 下。

# ── profiles/neko/profile.yaml ──────────────────────────────────────────────
model: openai:gpt-5.6-luna # provider:model[:思考等级]，或 gateway 里定义的组名；等级：none/minimal/low/medium/high/xhigh/max
mode: channel # 缺省即 channel，写出来仅为示意

channels:
  # key 是账号（platform:selfId），value 是频道名单：
  #   `*` 全部，尾随 `*` 按前缀，其余精确匹配；`!` 开头表示排除。
  # 一个频道被认领，需要命中至少一个正项、且不命中任何排除项，与书写顺序无关。
  "onebot:10000":
    - "group:*"
    - "private:*"
    - "!group:987654321" # 这个群被另一个 profile 认领时，靠它让开

failover:
  attempts: 3 # 缺省跑完一轮候选
  backoffMs: 500 # 逐次翻倍，封顶 8s，取半抖动
  failoverOn: unavailable # 或 any

context:
  # 上下文引擎：standard 线性增长，到上限后把最旧的一段压成摘要。
  # 引擎实例随每个频道实例各造一份，压缩水位不按频道分家也不会串台。
  engine: standard
  standard:
    maxTokens: 32000 # 单轮模型输入的 token 上限
    refillRatio: 0.8 # 压缩后压到上限的多少，留出余量

wakeup:
  # 唤醒引擎：standard 在消息提交后收到通知，按下面几条判定这条消息要不要理，
  # 要理就自己开轮（模型声明的 wait 条件与显式 wake 不经过引擎）
  engine: standard
  standard:
    direct: true # 私聊必醒
    atSelf: true # 被 @ 必醒
    quoteSelf: true # 被引用回复必醒
    keywords: [neko, 喵酱] # 提到这些词也醒

toolcall:
  # 工具调用引擎：native 用模型原生 function call（缺省）；
  # 其余按输出协议名取，由解析引擎从纯文本输出里提取调用，不需要模型原生支持 function call：
  # hermes / qwen3coder / morph-xml / yaml-xml
  engine: native

# 代码模式：模型写一段 JavaScript，程序在沙箱里调工具，中间数据不出上下文。
# 与 toolcall 正交——toolcall 管输出协议，这里管工具面。默认开启。
codemode:
  enable: true
  # 哪些业务工具还能被模型直接调用。send_message 固定两处都可达（直调发言省一层程序，
  # 程序里也要能说话），finish 与 wait 固定只留目录（收尾与等待由模型直调发起）。
  # 这里列出的业务工具同时留在模型目录里，程序里也仍然够得着；没列出的业务工具收进沙箱、
  # 从模型目录里消失，只有程序的 tools 里调得到。
  direct: []
  timeoutMs: 30000 # 单次沙箱执行的总时限（毫秒），程序可用 // @options 覆盖
  memoryLimitBytes: 268435456 # 256 MiB，QuickJS 内存预算
  maxOutputTokens: 10000 # 工具结果里 RESULT / TEXT / CONSOLE 预览的预算，按 4 字符 ≈ 1 token 折算

# 一次唤醒（一轮）的步数预算。maxSteps 是硬上限：走到这一步 runtime 直接结束这一轮，
# 所以剩下的步数不够时，程序会在每次请求前附一句「还剩几步」的提醒，
# 让模型在最后一步用一条 send_message 交代结果，避免整轮没有任何回应。
pacing:
  maxSteps: 20 # 一轮最多几步；也是硬上限
  wrapUpSteps: 2 # 剩余步数不多于这个值时每一步都提醒收尾；0 关闭
  progressAt: 8 # 走到第几步时提醒汇报一次进度（一轮最多一次，已发过消息则不提醒）；0 关闭

# 发消息前等多久，模拟打字
typing:
  baseDelay: 500
  charPerSecond: 5
  minDelay: 800
  maxDelay: 4000

# 平台图片与工具图片共用请求级附件策略。imageInput 是 profile 能力上限；
# 开启时，models.yaml 中的模型及 failover 组内每个候选都必须声明 input: [text, image]。
# 每个媒体项带 lifetime，默认 once：只嵌入一次，携带它的模型响应成功持久化后才消耗展示机会，失败或中止不消耗。
# recent 保留最近查看过的图片（目标 recentImageCount 张）：活动图片超出时按 imagePruneBatchSize
# 成批移除最旧的已查看图片，未查看的图片永远不参与移除；被硬预算挤出的已查看图片直接释放，
# 来源记录被移除时同样释放（含已持久化的交付状态）。
# retain 在来源记录仍处活动上下文时每轮都可嵌入，由上下文移除来源记录决定何时释放（含已持久化的交付状态）；
# 本次请求预算不足时暂不携带。
# 改写生命周期只有两个入口：codemode 程序通过 image() 保存的图片项，或 imageInput 开启时直接 read 的 lifetime 参数。
# 工具原始媒体在最终输出阶段归档为 artifact；下一 step 以带来源说明的 user/file 消息加载。
# codemode 内 read 始终返回 JSON-safe base64，纯文本模型也可将图片传给后续工具。
# 不自动缩放；超过预算的图片等待容量，不能加载或不支持的媒体逐轮重试并保留 URL 与原因说明。
attachment:
  imageInput: false
  recentImageCount: 3 # recent 生命周期的目标保留数
  imagePruneBatchSize: 2 # 每次移除的最旧已查看图片数
  maxImageBytes: 5242880 # 单图 5 MiB
  maxTotalImageBytes: 10485760 # 整次请求 10 MiB，跨平台与工具附件累计
  maxImageCount: 4
  maxImageDimension: 8000 # 已知尺寸的单边像素上限

# read 与统一出口共用一份文本预算：2000 行、单行 2000 字符、30000 UTF-16 字符。
# :1-200 / :50+30 选择行。超长单行会被截断，截掉的部分只能在 codemode 或沙箱里读到。
# ?view=meta 查看元数据，不取字节。
# MCP 插件旧 limits 已移入 resources。
# workspace 旧 maxOutputLength 已移除；maxExecutionOutputBytes 默认 33554432 是执行安全上限。

# 扩展包：键是包名，值是这个 profile 给它的东西。extends 只启用包附加的能力，
# 不决定引擎：某个引擎变体可不可用，只看 `ishiki.engine.<族>.<名字>` 这个 Koishi Service
# 在不在，名字带不带包前缀都一样。变体名写在上面 context / wakeup / toolcall 三段里。
# 只写包名即启用（config 省略），enable: false 的在展开时就筛掉（静态）；剩下的每一项都是必需依赖，
# profile 缺哪个就停在等待态并报一条。
# 包交回的那个 handler 在每个实例的装配期被叫一次，能加的只有工具与提示词；
# config 原样递给包，字段含义由包自己解释。
# extends:
#   workspace:
#     config:
#       cwd: /home/workspace
#   mcp-client: {}
#   vision-pack:
#     enable: false

# ── profiles/fused/profile.yaml ─────────────────────────────────────────────
# 多频道合成一块视窗：mode: cross 时整个 profile 只有一个 runtime，
# 认领的频道共享同一份事实流、同一套引擎实例。合流之后没有「当前频道」，
# 所以出站要显式写坐标（send_message 的 target），格式为
# `{ sid: "platform:selfId", channelId: "频道号" }`。每个频道事实块前会有
# `[channel target={"sid":"platform:selfId","channelId":"频道号"}]` 寻址头，
# 可将其中完整 target 对象原样复制给 send_message。群聊和私聊都使用 channelId。
# 代价在 token：认领的频道全部消息进同一块窗口，认领范围别铺太开。
# channels 的 key 可以写多个账号，把多个账号合流；同一账号的同一批频道只能归一个 profile。
#
# model: openai:gpt-5.6-luna
# mode: cross # 与 channel 的差别只有 runtime 的派生粒度
# channels:
#   "onebot:10000":
#     - "group:*" # 群聊
#     - "private:*" # 与这个账号的私聊
#     - "!group:987654321" # 不想合进来的照旧用 `!` 排除
# context:
#   engine: standard
#   standard:
#     maxTokens: 32000
# wakeup:
#   engine: standard
#   standard:
#     direct: true
#     atSelf: true
#     quoteSelf: true
#     keywords: [neko, 喵酱]

# ── profiles/jev/profile.yaml ───────────────────────────────────────────────
# 唤醒交给 Jev（TypeSafe）判定：规则只兜私聊与 @，其余消息都问一次模型。
# 需要 apiKey，或环境变量 TYPESAFE_API_KEY；缺了这份 profile 会在装载时被跳过。
#
# model: openai:gpt-5.6-luna
# context:
#   engine: standard # 上下文与唤醒各自独立，这里只把唤醒换掉
# wakeup:
#   engine: jev
#   jev:
#     # 三个问句各判一维，再合成一个量：
#     #   addressed  这条是不是在跟本 bot 说
#     #   interested  本 bot 对这个话题有没有话说（读下面的 interests）
#     #   others     是不是别人之间的对话
#     # 合成式 sqrt(max(addressed, interested) × (1 - others))，过 threshold 才开口。
#     # 拆成三维而不是一个数，是因为「没人在找它，但它正好有话想说」在单问句里只能给低分。
#
#     # 补充判据：语气、什么时候该闭嘴都写在这里。三个问句的 criteria 是判定下限，
#     # 这段在它之上加约束——写得好是加分，写漏了也不塌下限。身份与兴趣不进这里，见 interests。
#     instruction: |
#       neko，猫娘，话不多但会接梗。
#       只在有人点名、话题与自己在做的工作有关、或有人明显在征求意见时插话；
#       几个人互相寒暄时保持安静。
#     # 本 bot 关心的话题，逐条写。只 interested 那一维读它，也是它唯一的信息来源：
#     # 留空 = 不偏袒任何话题，判定只靠 addressed 与 others 两维。
#     interests:
#       - LLM 工程与调试
#       - 群聊 bot 的行为设计
#       - TypeScript
#     # 合成量的下限，不是单个问句的置信度：三个问句都给 0.5（都没证据）时合成恰好 0.5。
#     # 因此 0.5 是「毫无证据也开口」的临界值，调高它收紧的是合成量。
#     threshold: 0.5
#     cooldownMs: 30000 # 上次开口后的静默期（毫秒）；硬命中的规则不受它约束
#     historyMessages: 8 # 喂给模型的最近消息条数
#     timeoutMs: 1500 # 单次判定等待上限（毫秒），超时按不唤醒处理
#     # 兜底规则：命中即唤醒、不问模型。默认只开私聊与 @，其余交给模型。
#     # 只在 engine: jev 这一段里写——写成 jev 同级的 standard 段不会被读。
#     rules:
#       direct: true
#       atSelf: true
#       quoteSelf: false
#       keywords: []
# channels:
#   "onebot:10000":
#     - "group:*"
#     - "private:*"
