# Profile 示例：一个 profile.yaml 定义一个心智，目录名就是它的全局唯一 id。
# 放在 <dataPath>/profiles/<目录名>/profile.yml（或 .yaml）。
#
# 下面的四段是四份**互相独立**的文件（四个目录），用注释分开，方便对照着看：
#   profiles/neko/profile.yaml   按频道隔离：每个认领的频道各派生一个意识实例
#   profiles/fused/profile.yaml  cross：多账号多频道合成一块视窗
#   profiles/v3/profile.yaml     从 YesImBot v3 迁过来的一套引擎
#   profiles/jev/profile.yaml    唤醒交给 Jev（TypeSafe）判定
#
# 一个 profile 就是生效单位：channels 声明它认领哪些账号下的哪些频道，
# 装配时静态过滤，认领关系不会随事件变化。mode 决定派生方式：
#   channel（缺省）  每个频道一个 runtime，历史互不相通
#   cross           整个 profile 只有一个 runtime，认领的频道共享同一块事实流
# profile 目录下的 persona.md、memory/、mcp.json 等由所有 runtime 共享，
# 每个 runtime 的事实流与工作区放在 runtimes/<账号/频道>/ 下。

# ── profiles/neko/profile.yaml ──────────────────────────────────────────────
model: openai:gpt-5.6-luna # provider:model[:思考等级]，或 gateway 里定义的组名；等级：none/minimal/low/medium/high/xhigh/max
mode: channel # 缺省即 channel，写出来仅为示意

channels:
  # key 是账号（platform:selfId），value 是频道名单：
  #   `*` 全部，尾随 `*` 按前缀，其余精确匹配；`!` 开头表示排除。
  # 一个频道被认领，需要命中至少一个正项、且不命中任何排除项，与书写顺序无关。
  "onebot:10000":
    - "group:*"
    - "private:*"
    - "!group:987654321" # 这个群被另一个 profile 认领时，靠它让开

failover:
  attempts: 3 # 缺省跑完一轮候选
  backoffMs: 500 # 逐次翻倍，封顶 8s，取半抖动
  failoverOn: unavailable # 或 any

context:
  # 上下文引擎：standard 线性增长，到上限后把最旧的一段压成摘要。
  # 引擎实例随每个频道实例各造一份，压缩水位不按频道分家也不会串台。
  engine: standard
  standard:
    maxTokens: 32000 # 单轮模型输入的 token 上限
    refillRatio: 0.8 # 压缩后压到上限的多少，留出余量

wakeup:
  # 唤醒引擎：standard 按下面几条判定一条消息要不要理
  engine: standard
  standard:
    direct: true # 私聊必醒
    atSelf: true # 被 @ 必醒
    quoteSelf: true # 被引用回复必醒
    keywords: [neko, 喵酱] # 提到这些词也醒

toolcall:
  # 工具调用引擎：native 用模型原生 function call（缺省）；
  # 其余按输出协议名取，由解析引擎从纯文本输出里提取调用，不需要模型原生支持 function call：
  # v3（JSON OUTPUT，每步必带 thoughts 三段）/ hermes / qwen3coder / morph-xml / yaml-xml
  engine: native

# 代码模式：模型改写一段程序，程序在沙箱里调工具，中间数据不出上下文。
# 与 toolcall 正交——toolcall 管输出协议，这里管工具面。默认关闭。
codemode:
  enable: false
  # 哪些工具能被谁调。没写进 direct 的工具收进沙箱、从模型目录里消失，
  # 只有程序调得到；写进 direct 的工具只留模型目录，程序够不着它。
  # send_message 固定两处都可达（直调发言省一层程序，程序里也要能说话），
  # finish 固定只留目录（收尾由模型直调发起，程序里的收尾不该结束轮次）。
  direct: []
  timeoutMs: 30000 # 单次沙箱执行的总时限（毫秒）

# 发消息前等多久，模拟打字
typing:
  baseDelay: 500
  charPerSecond: 5
  minDelay: 800
  maxDelay: 4000

# 模型的资源能力。imageInput: true 表示所用模型能看图：read 一张图片时
# 返回图片本身（file part）；缺省 false 时返回一行文字描述
# （`asset://...: image/png, 12.3 KiB. This model cannot view images directly.`）。
# 这只改数据形态，不决定模型会不会调 read —— 会看图的模型务必打开。
resources:
  imageInput: false

# 扩展包：键是包名，值是这个 profile 给它的东西。extends 只启用包附加的能力，
# 不决定引擎：某个引擎变体可不可用，只看 `ishiki.engine.<族>.<名字>` 这个 Koishi Service
# 在不在，名字带不带包前缀都一样。变体名写在上面 context / wakeup / toolcall 三段里。
# 只写包名即启用（config 省略），enable: false 的在展开时就筛掉（静态）；剩下的每一项都是必需依赖，
# profile 缺哪个就停在等待态并报一条。
# 包交回的那个 handler 在每个实例的装配期被叫一次，能加的只有工具与提示词；
# config 原样递给包，字段含义由包自己解释。
# extends:
#   workspace:
#     config:
#       cwd: /home/workspace
#   mcp-client: {}
#   vision-pack:
#     enable: false

# ── profiles/fused/profile.yaml ─────────────────────────────────────────────
# 多频道合成一块视窗：mode: cross 时整个 profile 只有一个 runtime，
# 认领的频道共享同一份事实流、同一套引擎实例。合流之后没有「当前频道」，
# 所以出站要显式写坐标（send_message 的 target），格式为
# `{ sid: "platform:selfId", channelId: "频道号" }`。每个频道事实块前会有
# `[channel target={"sid":"platform:selfId","channelId":"频道号"}]` 寻址头，
# 可将其中完整 target 对象原样复制给 send_message。群聊和私聊都使用 channelId。
# 代价在 token：认领的频道全部消息进同一块窗口，认领范围别铺太开。
# channels 的 key 可以写多个账号，把多个账号合流；同一账号的同一批频道只能归一个 profile。
#
# model: openai:gpt-5.6-luna
# mode: cross # 与 channel 的差别只有 runtime 的派生粒度
# channels:
#   "onebot:10000":
#     - "group:*" # 群聊
#     - "private:*" # 与这个账号的私聊
#     - "!group:987654321" # 不想合进来的照旧用 `!` 排除
# context:
#   engine: standard
#   standard:
#     maxTokens: 32000
# wakeup:
#   engine: standard
#   standard:
#     direct: true
#     atSelf: true
#     quoteSelf: true
#     keywords: [neko, 喵酱]

# ── profiles/v3/profile.yaml ────────────────────────────────────────────────
# 从 YesImBot v3 迁过来的一套：WorldState 上下文、JSON OUTPUT 工具协议、响应意愿唤醒。
# 三者各自独立，也可以和别的引擎混搭。
#
# model: openai:gpt-5.6-luna
# context:
#   engine: v3
#   v3:
#     maxMessages: 50 # 单轮窗口内的消息条数上限
#     keepFullTurnCount: 2 # 保留最近几轮的完整思考/行动/观察，更早的只留消息
#     memoryBlocks: true # 把 <profileDir>/memory/*.md 当核心记忆块注入 system
# wakeup:
#   engine: v3
#   v3:
#     base: 12 # 一条普通消息的基础分
#     atMention: 100 # 被 @ 的加成
#     isQuote: 15 # 引用本账号的加成
#     isDirectMessage: 40 # 私聊的加成
#     keywords: [neko, 喵酱] # 命中任一即改用 keywordMultiplier
#     keywordMultiplier: 1.2
#     defaultMultiplier: 1
#     maxWillingness: 100 # 意愿上限
#     decayHalfLifeSeconds: 600 # 不被打扰时的衰减半衰期
#     probabilityThreshold: 55 # 概率从这个阈值之上起跳
#     probabilityAmplifier: 0.04
#     replyCost: 35 # 一轮结束后扣掉的意愿
# toolcall:
#   engine: v3
# channels:
#   # v3 的唤醒按频道攒意愿值；channel 模式下每个频道本来就是独立的 runtime，
#   # 群聊与私聊各得各的意愿，不需要再拆 profile。
#   "onebot:10000":
#     - "group:*"
#     - "private:*"

# ── profiles/jev/profile.yaml ───────────────────────────────────────────────
# 唤醒交给 Jev（TypeSafe）判定：规则只兜私聊与 @，其余消息都问一次模型。
# 需要 apiKey，或环境变量 TYPESAFE_API_KEY；缺了这份 profile 会在装载时被跳过。
#
# model: openai:gpt-5.6-luna
# context:
#   engine: standard # 上下文与唤醒各自独立，这里只把唤醒换掉
# wakeup:
#   engine: jev
#   jev:
#     # 三个问句各判一维，再合成一个量：
#     #   addressed  这条是不是在跟本 bot 说
#     #   interested  本 bot 对这个话题有没有话说（读下面的 interests）
#     #   others     是不是别人之间的对话
#     # 合成式 sqrt(max(addressed, interested) × (1 - others))，过 threshold 才开口。
#     # 拆成三维而不是一个数，是因为「没人在找它，但它正好有话想说」在单问句里只能给低分。
#
#     # 补充判据：语气、什么时候该闭嘴都写在这里。三个问句的 criteria 是判定下限，
#     # 这段在它之上加约束——写得好是加分，写漏了也不塌下限。身份与兴趣不进这里，见 interests。
#     instruction: |
#       neko，猫娘，话不多但会接梗。
#       只在有人点名、话题与自己在做的工作有关、或有人明显在征求意见时插话；
#       几个人互相寒暄时保持安静。
#     # 本 bot 关心的话题，逐条写。只 interested 那一维读它，也是它唯一的信息来源：
#     # 留空 = 不偏袒任何话题，判定只靠 addressed 与 others 两维。
#     interests:
#       - LLM 工程与调试
#       - 群聊 bot 的行为设计
#       - TypeScript
#     # 合成量的下限，不是单个问句的置信度：三个问句都给 0.5（都没证据）时合成恰好 0.5。
#     # 因此 0.5 是「毫无证据也开口」的临界值，调高它收紧的是合成量。
#     threshold: 0.5
#     cooldownMs: 30000 # 上次开口后的静默期（毫秒）；硬命中的规则不受它约束
#     historyMessages: 8 # 喂给模型的最近消息条数
#     timeoutMs: 1500 # 单次判定等待上限（毫秒），超时按不唤醒处理
#     # 兜底规则：命中即唤醒、不问模型。默认只开私聊与 @，其余交给模型。
#     # 只在 engine: jev 这一段里写——写成 jev 同级的 standard 段不会被读。
#     rules:
#       direct: true
#       atSelf: true
#       quoteSelf: false
#       keywords: []
# channels:
#   "onebot:10000":
#     - "group:*"
#     - "private:*"
